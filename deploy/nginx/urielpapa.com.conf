# urielpapa.com on the VPS (deploy/README.md).
# Cloudflare proxies every request (the firewall admits 80/443 only from
# Cloudflare) and talks to this server over TLS with a Cloudflare Origin CA
# certificate. Nginx serves the prebuilt pages from the current release and
# passes the on-demand routes to the Astro Node server on 127.0.0.1:4321.
#
# The headers and redirects below match scripts/vercel-routes.mjs, which does
# the same job on Vercel. Change both together until Vercel is retired.
#
# Installed as /etc/nginx/sites-available/urielpapa.com, linked from
# sites-enabled. The maps sit at http level, so their names carry a up_ prefix.

map $uri $up_robots {
    default                                    "";
    "~^/(blog|news|events)/[^/]+\.md$"         "noindex";
    "/deploy-version.json"                     "noindex, nofollow";
    "~^/email/"                                "noindex, noimageindex, nofollow, noarchive";
    "~^/(keystatic|api|preview|dashboard)(/|$)" "noindex, nofollow";
}

# Markdown copies for AI tools point back at their HTML page.
map $uri $up_canonical {
    default                                                  "";
    "~^/(?<up_sec>blog|news|events)/(?<up_slug>[^/]+)\.md$"  "<https://urielpapa.com/$up_sec/$up_slug>; rel=\"canonical\"";
}

# The on-demand routes set their own Cache-Control, so Nginx adds none there.
map $uri $up_cache {
    default                                    "public, max-age=0, must-revalidate";
    "~^/_astro/"                               "public, max-age=31536000, immutable";
    "/deploy-version.json"                     "no-store";
    "~^/email/"                                "public, max-age=86400";
    "~^/(api|keystatic|dashboard|preview)(/|$)" "";
}

# Report-only until checked; Keystatic needs GitHub and inline React, so it is left out.
map $uri $up_csp {
    default        "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.googletagmanager.com https://challenges.cloudflare.com https://platform.twitter.com https://cdn.syndication.twimg.com https://www.threads.net https://www.threads.com https://a.plerdy.com https://www.clarity.ms https://*.clarity.ms; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com https://pbs.twimg.com https://abs.twimg.com https://*.cdninstagram.com https://websitelaunches.com https://*.google-analytics.com https://*.googletagmanager.com https://*.plerdy.com https://*.clarity.ms https://c.bing.com; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://challenges.cloudflare.com https://*.plerdy.com wss://a.plerdy.com https://*.clarity.ms https://c.bing.com; frame-src https://www.youtube-nocookie.com https://calendar.google.com https://challenges.cloudflare.com https://platform.twitter.com https://syndication.twitter.com https://www.threads.net https://www.threads.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'";
    "~^/keystatic" "";
}

upstream urielpapa_node {
    server 127.0.0.1:4321;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name urielpapa.com www.urielpapa.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://urielpapa.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.urielpapa.com;
    ssl_certificate     /etc/nginx/ssl/urielpapa.com/fullchain.pem;  # Cloudflare Origin CA (urielpapa.com, *.urielpapa.com)
    ssl_certificate_key /etc/nginx/ssl/urielpapa.com/privkey.pem;
    # www plus a trailing slash goes to the final URL in one hop, as on Vercel
    # (scripts/vercel-routes.mjs), instead of www -> apex -> no slash.
    location ~ ^/(.+?)/+$ { return 308 https://urielpapa.com/$1$is_args$args; }
    location / { return 308 https://urielpapa.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name urielpapa.com;
    ssl_certificate     /etc/nginx/ssl/urielpapa.com/fullchain.pem;  # Cloudflare Origin CA (urielpapa.com, *.urielpapa.com)
    ssl_certificate_key /etc/nginx/ssl/urielpapa.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/urielpapa.access.log;
    error_log  /var/log/nginx/urielpapa.error.log;

    # The visitor's address, not Cloudflare's, for logs and the forms' rate limit.
    # Ranges from https://www.cloudflare.com/ips (17 Nov 2026).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    root /srv/urielpapa.com/current/client;
    charset utf-8;
    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml
               text/xml application/xml application/rss+xml text/plain text/markdown
               application/manifest+json;
    gzip_min_length 512;

    add_header Strict-Transport-Security          "max-age=63072000" always;
    add_header X-Content-Type-Options             "nosniff" always;
    add_header Referrer-Policy                    "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options                    "SAMEORIGIN" always;
    add_header Permissions-Policy                 "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy-Report-Only $up_csp always;
    add_header X-Robots-Tag                       $up_robots always;
    add_header Cache-Control                      $up_cache always;
    add_header Link                               $up_canonical always;

    # Astro's on-demand image endpoint is unused (images are prerendered to /_astro).
    location = /_image { return 404; }

    # On-demand routes: forms, the private dashboard, Keystatic and draft previews.
    location ~ ^/(api|keystatic|dashboard|preview)(/|$) {
        proxy_pass http://urielpapa_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host urielpapa.com;
        proxy_set_header X-Forwarded-Host urielpapa.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # src/middleware.ts sets this too; send Nginx's copy only, not two.
        proxy_hide_header X-Robots-Tag;
        # The dashboard's search refresh streams progress for up to a minute or two.
        proxy_buffering off;
        proxy_read_timeout 180s;
        client_max_body_size 10m;
    }

    # Markdown copies of posts.
    location ~ ^/(blog|news|events)/[^/]+\.md$ {
        types { }
        default_type "text/markdown; charset=utf-8";
    }

    # trailingSlash: "never". /blog/ goes to /blog, like Vercel.
    location ~ ^/(.+)/$ {
        return 308 /$1$is_args$args;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
